  <p>言灵，是云中江树的个人项目。</p>
  <p>「言」是说话，「灵」是灵性。名字取「言出法随」之意：话一出口，便成现实。</p>
  <p>这个项目关心的是：人如何用语言驾驭 AI——把意图说清、说准，让通用的 AI 与 Agent 听得懂、做得对、靠得住；也让 AI 更好地运用 AI。</p>
